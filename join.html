<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dołącz do mnie w BubuFriend 💞</title>
<meta name="description" content="Prywatna aplikacja tylko dla Was dwojga. Kliknij, żeby połączyć się w parę.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="BubuFriend">
<meta property="og:title" content="Dołącz do mnie w BubuFriend 💞">
<meta property="og:description" content="Prywatna aplikacja tylko dla Was dwojga. Kliknij, żeby połączyć się w parę.">
<meta property="og:image" content="https://dziondzio.github.io/bubufriend-legal/og-invite.png">
<meta property="og:image:width" content="1024">
<meta property="og:image:height" content="500">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root { color-scheme: light dark; --bg: #fff1f7; --card: #ffffff; --text: #1f1a24; --muted: #6b6475; --accent: #ec4899; --accent2: #8b5cf6; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f0f14; --card: #1a1a22; --text: #f3eef7; --muted: #a59fb0; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font: 16px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; align-items: center; justify-content: center; }
  main { width: 100%; max-width: 440px; padding: 32px 16px; text-align: center; }
  img.logo { width: 112px; height: 112px; border-radius: 28px; box-shadow: 0 12px 32px rgba(236, 72, 153, .25); }
  h1 { font-size: 26px; line-height: 1.2; margin: 20px 0 8px; }
  p { color: var(--muted); margin: 0 0 20px; }
  .code { background: var(--card); border-radius: 20px; padding: 18px; margin: 0 0 20px; }
  .code b { display: block; font-size: 38px; letter-spacing: 8px; color: var(--accent2); }
  .code small { color: var(--muted); }
  a.btn, button.btn { display: block; width: 100%; border: 0; border-radius: 16px; padding: 15px; margin: 0 0 10px; font-family: inherit; font-size: 17px; font-weight: 700; line-height: 1; text-decoration: none; cursor: pointer; }
  .primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; }
  .secondary { background: var(--card); color: var(--text); }
  .steps { text-align: left; background: var(--card); border-radius: 16px; padding: 14px 18px; color: var(--muted); font-size: 14px; }
  .steps ol { margin: 6px 0 0; padding-left: 20px; }
</style>
</head>
<body>
<main>
  <img class="logo" src="og-icon.png" alt="BubuFriend">
  <h1 id="title">Dołącz do mnie w BubuFriend 💞</h1>
  <p id="lead">Prywatna aplikacja tylko dla Was dwojga.</p>
  <div class="code" id="codebox" hidden><small id="codeLabel">Kod zaproszenia</small><b id="code"></b></div>
  <a class="btn primary" id="open" href="#">Otwórz w aplikacji</a>
  <a class="btn secondary" id="store" href="https://play.google.com/store/apps/details?id=com.bubufriend.app">Pobierz z Google Play</a>
  <button class="btn secondary" id="copy" hidden>Kopiuj kod</button>
  <div class="steps" id="steps"></div>
</main>
<script>
  var raw = (new URLSearchParams(location.search).get('code') || '').toUpperCase();
  var code = /^[A-Z0-9]{6}$/.test(raw) ? raw : '';
  var en = !/^pl/i.test(navigator.language || '');
  var T = en
    ? { title: 'Join me on BubuFriend 💞', lead: 'A private app just for the two of you.', label: 'Invite code', open: 'Open in the app', store: 'Get it on Google Play', copy: 'Copy code', copied: 'Copied ✅',
        steps: '<b>No app yet?</b><ol><li>Install BubuFriend from Google Play.</li><li>Come back here and tap “Open in the app”, or enter the code.</li></ol>' }
    : { title: 'Dołącz do mnie w BubuFriend 💞', lead: 'Prywatna aplikacja tylko dla Was dwojga.', label: 'Kod zaproszenia', open: 'Otwórz w aplikacji', store: 'Pobierz z Google Play', copy: 'Kopiuj kod', copied: 'Skopiowano ✅',
        steps: '<b>Nie masz jeszcze aplikacji?</b><ol><li>Zainstaluj BubuFriend z Google Play.</li><li>Wróć tutaj i stuknij „Otwórz w aplikacji” albo wpisz kod.</li></ol>' };
  if (en) document.documentElement.lang = 'en';
  ['title', 'lead', 'open', 'store', 'copy'].forEach(function (id) { document.getElementById(id).textContent = T[id]; });
  document.getElementById('codeLabel').textContent = T.label;
  document.getElementById('steps').innerHTML = T.steps;
  var app = 'bubufriend://pair' + (code ? '?code=' + code : '');
  var android = /android/i.test(navigator.userAgent);
  // Android: intent:// otwiera aplikację, a gdy jej nie ma — Google Play.
  document.getElementById('open').href = android
    ? 'intent://pair' + (code ? '?code=' + code : '') + '#Intent;scheme=bubufriend;package=com.bubufriend.app;S.browser_fallback_url=' + encodeURIComponent('https://play.google.com/store/apps/details?id=com.bubufriend.app') + ';end'
    : app;
  if (code) {
    document.getElementById('code').textContent = code;
    document.getElementById('codebox').hidden = false;
    var copy = document.getElementById('copy');
    copy.hidden = false;
    copy.onclick = function () {
      (navigator.clipboard ? navigator.clipboard.writeText(code) : Promise.reject()).then(function () { copy.textContent = T.copied; }, function () {});
    };
  }
</script>
</body>
</html>
